<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Team Dashboard — Divine Talent</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
<script src="https://unpkg.com/simple-peer@9/simplepeer.min.js"></script>
</head>
<body>

  <div id="password-screen" class="password-screen">
    <div class="password-box">
      <h2>Team Login</h2>
      <input id="password-input" type="password" placeholder="Password" autofocus />
      <button id="password-submit">Unlock</button>
      <p id="password-error" class="error-text" style="display:none">Incorrect password.</p>
    </div>
  </div>

  <div id="app" style="display:none">
    <header>
      <h1>Team Dashboard</h1>
      <div class="conn-status">
        <span id="viewer-count" class="viewer-count-text"></span>
        <span id="conn-dot" class="dot offline"></span>
        <span id="conn-text">Connecting...</span>
      </div>
    </header>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="live">Live View</button>
      <button class="tab-btn" data-tab="history">Screenshot History</button>
    </nav>

    <main id="live-tab" class="tab-panel">
      <div class="sub-nav">
        <button class="sub-nav-btn active" data-group="granted">Extra Access Granted</button>
        <button class="sub-nav-btn" data-group="standard">Standard Monitoring Only</button>
      </div>
      <div id="live-grid" class="grid"></div>
    </main>

    <main id="history-tab" class="tab-panel" style="display:none">
      <div class="sub-nav">
        <button class="sub-nav-btn active" data-hgroup="granted">Screenshot Access Granted</button>
        <button class="sub-nav-btn" data-hgroup="none">No Screenshot Access</button>
      </div>
      <div class="history-controls" id="history-controls-wrap">
        <select id="device-select"></select>
        <button id="refresh-history">Refresh</button>
      </div>
      <div class="column-controls">
        <span>Columns:</span>
        <button class="col-btn" data-cols="4">4</button>
        <button class="col-btn" data-cols="6">6</button>
        <button class="col-btn active" data-cols="8">8</button>
        <button class="col-btn" data-cols="10">10</button>
        <button class="col-btn" data-cols="12">12</button>
      </div>
      <div id="history-gallery"></div>
      <div id="no-access-list"></div>
    </main>
  </div>

  <!-- Camera/mic viewing modal -->
  <div id="camera-overlay" class="focus-overlay" style="display:none">
    <div class="focus-modal">
      <div class="focus-header">
        <span id="camera-label"></span>
        <div><button id="camera-close">Close</button></div>
      </div>
      <video id="camera-video" autoplay playsinline></video>
    </div>
  </div>

  <!-- Remote control modal -->
  <div id="remote-overlay" class="focus-overlay" style="display:none">
    <div class="focus-modal">
      <div class="focus-header">
        <span id="remote-label"></span>
        <div><button id="remote-close">Close</button></div>
      </div>
      <video id="remote-video" autoplay playsinline muted></video>
      <div class="resize-hint">Click the video to click there. Type to send keystrokes to this laptop.</div>
    </div>
  </div>

  <!-- Larger view for a single stored screenshot -->
  <div id="image-lightbox" class="lightbox" style="display:none">
    <button id="lightbox-close" class="lightbox-close">Close</button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev">&larr;</button>
    <img id="lightbox-img" />
    <button id="lightbox-next" class="lightbox-nav lightbox-next">&rarr;</button>
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <!-- Confirmation popup before turning something on or off -->
  <div id="confirm-popup" class="password-screen" style="display:none; background: rgba(0,0,0,0.3);">
    <div class="password-box">
      <h2 id="confirm-popup-text">Are you sure?</h2>
      <div style="display:flex; gap:8px;">
        <button id="confirm-popup-cancel" style="flex:1; background:#9ca3af;">Cancel</button>
        <button id="confirm-popup-ok" style="flex:1;">OK</button>
      </div>
    </div>
  </div>

  <script src="member-app.js"></script>
</body>
</html>
